spring:
  application:
    name: herald
  main:
    # Startup cost matters more than first-request latency on the free tier this
    # service targets. Beans that must exist eagerly (schedulers) opt out with
    # @Lazy(false).
    lazy-initialization: true
  jmx:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it
  datasource:
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000 # serverless Postgres can take a few seconds to wake

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never # /actuator/health is public (uptime pings); details stay private

herald:
  # Empty admin key disables the /admin/v1/** surface entirely (fail closed).
  admin-api-key: ${ADMIN_API_KEY:}
  # Base64 256-bit key (openssl rand -base64 32). Encrypts the provider
  # credentials tenants hand over. Empty pauses WhatsApp rather than storing
  # them in the clear. Losing it means re-collecting every tenant's token.
  secret-key: ${HERALD_SECRET_KEY:}
  email:
    # The operator-owned domain every tenant gets a free sending address on.
    # Register and verify it once at the provider, publish its DNS records, then
    # set this. Empty disables the shared tier: tenants must then be created
    # with an explicit fromAddress on a domain the operator verified.
    shared-root-domain: ${HERALD_SHARED_ROOT_DOMAIN:}
  resend:
    base-url: https://api.resend.com
    # Empty key pauses dispatch: messages queue as PENDING until it is set.
    api-key: ${RESEND_API_KEY:}
    connect-timeout: 5s
    read-timeout: 10s
  whatsapp:
    base-url: https://graph.facebook.com
    # Bump deliberately: Graph API versions live about two years.
    api-version: v23.0
    connect-timeout: 5s
    read-timeout: 10s
    send-interval: 50ms
    template-sync-interval: PT30M
    # Answers Meta's webhook subscription handshake. One value for the whole
    # instance: that GET says nothing about which tenant is subscribing, so it
    # cannot be per tenant. Every real notification is still authenticated by
    # the tenant's own app secret. Empty refuses the handshake.
    webhook-verify-token: ${HERALD_WHATSAPP_VERIFY_TOKEN:}
  outbox:
    poll-interval: 3s
    batch-size: 10
    max-attempts: 8
    # Resend's free tier allows ~2 requests/second; pace sends well under that.
    # Channels whose provider allows more override this (ChannelProvider#sendInterval).
    send-interval: 600ms

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs

---
# Profile for the AOT/CDS training run in the Dockerfile: the context must
# start and exit without a database or any external service.
spring:
  config:
    activate:
      on-profile: cds
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  datasource:
    url: jdbc:postgresql://localhost:5432/herald
    username: herald
    password: herald
