name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest # ships with Docker, which Testcontainers needs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        # Invoked through bash so a commit made on Windows (where the execute
        # bit is easily lost) cannot break the pipeline.
        run: bash ./mvnw -B verify
