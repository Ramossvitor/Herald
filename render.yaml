# Render Blueprint. The database is external (Neon); only the web service
# lives here. Secrets are set in the dashboard (sync: false), never in git.
services:
  - type: web
    name: herald
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      # Encrypts tenants' WhatsApp credentials (openssl rand -base64 32). Keep a
      # backup outside Render: it is deliberately not in the database, so losing
      # it means collecting every tenant's token again.
      - key: HERALD_SECRET_KEY
        sync: false
      # Answers Meta's webhook subscription handshake.
      - key: HERALD_WHATSAPP_VERIFY_TOKEN
        sync: false
